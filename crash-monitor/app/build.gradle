plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.crashmonitor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.local.crashmonitor'
        minSdk 31
        targetSdk 35
        versionCode 7
        versionName '1.6-scrollable'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('CRASHMONITOR_KEYSTORE')
            if (ksPath != null && !ksPath.isEmpty()) {
                storeFile file(ksPath)
                storePassword System.getenv('CRASHMONITOR_STORE_PASSWORD')
                keyAlias System.getenv('CRASHMONITOR_KEY_ALIAS') ?: 'crashmonitor'
                keyPassword System.getenv('CRASHMONITOR_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing false
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
}
