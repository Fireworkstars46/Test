plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simple.datetimecalculator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.simple.datetimecalculator'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '2.3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
