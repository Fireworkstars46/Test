name: Prepare video review

# Temporary one-time helper for this test video.
on:
  pull_request:
    paths:
      - 'video-review-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download uploaded release ZIP
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o recording.zip "https://github.com/Fireworkstars46/Test/releases/download/Test/2026-08-08.01-56-59.zip"
          ls -lh recording.zip

      - name: Extract recording
        run: |
          set -euxo pipefail
          mkdir -p extracted
          unzip -q recording.zip -d extracted
          find extracted -maxdepth 3 -type f -printf '%p\n'

      - name: Locate video and record metadata
        run: |
          set -euxo pipefail
          VIDEO="$(find extracted -type f \( -iname '*.mp4' -o -iname '*.mkv' -o -iname '*.mov' -o -iname '*.avi' -o -iname '*.webm' \) -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$VIDEO"
          echo "VIDEO=$VIDEO" >> "$GITHUB_ENV"
          mkdir -p processed
          ffprobe -v error -show_format -show_streams "$VIDEO" > processed/metadata.txt
          echo "Selected video: $VIDEO" >> processed/metadata.txt

      - name: Make compact review chunks
        run: |
          set -euxo pipefail
          ffmpeg -hide_banner -y -i "$VIDEO" \
            -vf "fps=15,scale=-2:480" \
            -c:v libx264 -preset veryfast -crf 30 -pix_fmt yuv420p -an \
            -g 30 -keyint_min 30 -sc_threshold 0 \
            -f segment -segment_time 180 -reset_timestamps 1 \
            processed/chunk_%03d.mp4
          ls -lh processed

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-review
          path: processed/
          retention-days: 1
          compression-level: 0
