name: Build Date Time Calculator APK

on:
  push:
    branches:
      - date-time-calculator-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: DateTimeCalculator
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp DateTimeCalculator/app/build/outputs/apk/debug/app-debug.apk Date-Time-Calculator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: date-time-calculator-apk
          path: Date-Time-Calculator.apk
          retention-days: 7
          compression-level: 0
