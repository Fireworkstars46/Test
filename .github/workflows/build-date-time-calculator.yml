name: Build Date Time Calculator APK

on:
  push:
    branches:
      - date-time-calculator-build
    paths-ignore:
      - 'Date-Time-Calculator-v2.apk'
      - 'Date-Time-Calculator-v2.apk.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: DateTimeCalculator
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          cp DateTimeCalculator/app/build/outputs/apk/debug/app-debug.apk Date-Time-Calculator-v2.apk
          base64 Date-Time-Calculator-v2.apk > Date-Time-Calculator-v2.apk.b64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: date-time-calculator-v2-apk
          path: Date-Time-Calculator-v2.apk
          retention-days: 7
          compression-level: 0

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view DateTimeCalculator >/dev/null 2>&1; then
            gh release upload DateTimeCalculator Date-Time-Calculator-v2.apk --clobber
          else
            gh release create DateTimeCalculator Date-Time-Calculator-v2.apk --title "Date Time Calculator" --notes "Latest Android build"
          fi

      - name: Commit APK to build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Date-Time-Calculator-v2.apk Date-Time-Calculator-v2.apk.b64
          git commit -m "Build Date Time Calculator v2 APK" || exit 0
          git push
