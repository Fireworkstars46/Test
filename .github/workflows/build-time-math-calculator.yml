name: Build Time Math Calculator APK

on:
  push:
    branches:
      - time-math-calculator-final
    paths-ignore:
      - 'Time-Math-Calculator.apk'
      - 'Time-Math-Calculator.apk.b64'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: TimeMathCalculator
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          cp TimeMathCalculator/app/build/outputs/apk/debug/app-debug.apk Time-Math-Calculator.apk
          base64 Time-Math-Calculator.apk > Time-Math-Calculator.apk.b64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: time-math-calculator-apk
          path: Time-Math-Calculator.apk
          retention-days: 7
          compression-level: 0

      - name: Commit APK to build branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Time-Math-Calculator.apk Time-Math-Calculator.apk.b64
          git commit -m "Build Time Math Calculator APK" || exit 0
          git push
