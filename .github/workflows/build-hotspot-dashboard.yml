name: Build Hotspot Dashboard IPA

on:
  push:
    branches:
      - hotspot-dashboard-build
    paths:
      - '.github/workflows/build-hotspot-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Recreate source project
        shell: bash
        run: |
          cat > source.b64 <<'EOF'

EOF
          base64 --decode source.b64 > HotspotDashboard-iOS16-Source.zip
          mkdir source
          unzip -q HotspotDashboard-iOS16-Source.zip -d source
          find source -maxdepth 3 -type f -print

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euxo pipefail
          cd source
          xcodebuild \
            -project HotspotDashboard.xcodeproj \
            -target HotspotDashboard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail
          APP="$(find source/DerivedData/Build/Products -type d -name 'HotspotDashboard.app' | head -n 1)"
          test -n "$APP"
          mkdir -p package/Payload
          cp -R "$APP" package/Payload/
          cd package
          /usr/bin/zip -qry ../HotspotDashboard.ipa Payload
          cd ..
          ls -lh HotspotDashboard.ipa
          file HotspotDashboard.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HotspotDashboard-IPA
          path: HotspotDashboard.ipa
          retention-days: 1
          compression-level: 0
