name: Build Hey ChatGPT Assist v2.8 APK

on:
  push:
    branches:
      - hey-chatgpt-assist-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: HeyChatGPTAssist

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare v1.9 base source
        run: python3 prepare_v19.py

      - name: Apply v2.0 continuous listener
        run: python3 patch_v20_wake.py

      - name: Apply v2.0 corrected local model
        run: python3 patch_v20_model.py

      - name: Apply v2.0 local popup layout
        run: python3 patch_v20_local_ui.py

      - name: Apply v2.0 API popup layout
        run: python3 patch_v20_siri_ui.py

      - name: Finalize v2.0 source
        run: python3 patch_v20_finalize.py

      - name: Apply v2.1 popup task isolation
        run: python3 patch_v21_popup_task.py

      - name: Apply v2.2 Siri-like popup interaction
        run: python3 patch_v22_siri_interaction.py

      - name: Apply v2.3 automatic follow-up
        run: python3 patch_v23_followup.py

      - name: Apply v2.4 real ChatGPT Siri orb
        run: python3 patch_v24_real_chatgpt_orb.py

      - name: Apply v2.5 full ChatGPT Voice and text attempt
        run: python3 patch_v25_full_voice.py

      - name: Apply v2.6 live debug mode
        run: python3 patch_v26_debug.py

      - name: Apply v2.7 debug text file logging
        run: python3 patch_v27_debug_file.py

      - name: Apply v2.8 Voice stability and text filtering fixes
        run: python3 patch_v28_log_fixes.py

      - name: Fetch compatible pinned llama.cpp
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git llama.cpp
          cd llama.cpp
          git fetch --depth 1 origin c1366056f6cb6607b035e438fb1d10bc8b207364
          git checkout c1366056f6cb6607b035e438fb1d10bc8b207364
          cd ..
          python3 prepare_llama_module_v20.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK, and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeyChatGPTAssist-v2.8-apk
          path: HeyChatGPTAssist/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Stage APK signing tools
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" signing-tools/
          cp -r "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib" signing-tools/

      - name: Upload APK signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35-v28
          path: HeyChatGPTAssist/signing-tools
          if-no-files-found: error
