name: Build iCloud Notes APK

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build unsigned release APK
        run: gradle --no-daemon assembleRelease

      - name: Copy unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*unsigned*.apk' | head -n 1)"
          test -f "$APK"
          cp "$APK" iCloud-Notes-S22-v1.4-unsigned-release.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: iCloud-Notes-S22-v1.4-unsigned-release
          path: iCloud-Notes-S22-v1.4-unsigned-release.apk
          if-no-files-found: error
