name: Build iCloud Notes APK

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build unsigned release APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk iCloud-Notes-S22-v1.8-unsigned-release.apk

      - name: Collect Android APK signer
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_DIR="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p android-apksigner/lib
          cp "$TOOLS_DIR/apksigner" android-apksigner/apksigner
          cp "$TOOLS_DIR/lib/apksigner.jar" android-apksigner/lib/apksigner.jar

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iCloud-Notes-S22-v1.8-unsigned-release
          path: iCloud-Notes-S22-v1.8-unsigned-release.apk
          if-no-files-found: error

      - name: Upload APK signer
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: android-apksigner
          if-no-files-found: error
