name: Build App Hide Toggle

on:
  push:
    branches:
      - chatgpt-app-hide-toggle
    paths:
      - 'app-hide-toggle/**'
      - '.github/workflows/chatgpt-app-hide-toggle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: app-hide-toggle
        run: gradle --no-daemon :app:assembleRelease

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app-hide-toggle-build
          cp app-hide-toggle/app/build/outputs/apk/release/app-release-unsigned.apk app-hide-toggle-build/AppHideToggle-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AppHideToggle-Unsigned-Build
          path: app-hide-toggle-build/AppHideToggle-unsigned.apk
          if-no-files-found: error
