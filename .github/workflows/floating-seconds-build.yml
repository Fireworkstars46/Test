name: Build Floating Seconds IPA

on:
  push:
    branches:
      - floating-seconds-build
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore project and apply v1.6 larger seconds
        run: |
          git show 7d9934ac5f86c60e0e256c4016e992af48e9619b:floating-seconds-project.zip.b64 > original-project.b64
          python3 - <<'PY'
          import base64, pathlib
          src = pathlib.Path('original-project.b64').read_text().strip()
          pathlib.Path('floating-seconds-project.zip').write_bytes(base64.b64decode(src))
          patch = base64.b64decode(pathlib.Path('floating-seconds-v1.6-patch.zip.b64').read_text().strip())
          pathlib.Path('floating-seconds-v1.6-patch.zip').write_bytes(patch)
          PY
          unzip -q floating-seconds-project.zip
          mkdir -p v16
          unzip -q floating-seconds-v1.6-patch.zip -d v16
          cp v16/SettingsStore.swift FloatingSecondsBuildPayload/FloatingSeconds/SettingsStore.swift
          cp v16/ContentView.swift FloatingSecondsBuildPayload/FloatingSeconds/ContentView.swift
          cp v16/ClockRenderer.swift FloatingSecondsBuildPayload/FloatingSeconds/ClockRenderer.swift
          cp v16/PiPClockManager.swift FloatingSecondsBuildPayload/FloatingSeconds/PiPClockManager.swift
          python3 - <<'PY'
          from pathlib import Path
          p = Path('FloatingSecondsBuildPayload/project.yml')
          s = p.read_text()
          s = s.replace('MARKETING_VERSION: "1.0"', 'MARKETING_VERSION: "1.6"')
          s = s.replace('CURRENT_PROJECT_VERSION: "1"', 'CURRENT_PROJECT_VERSION: "7"')
          p.write_text(s)
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: FloatingSecondsBuildPayload
        run: xcodegen generate

      - name: Build unsigned iPhone app
        working-directory: FloatingSecondsBuildPayload
        run: |
          xcodebuild \
            -project FloatingSeconds.xcodeproj \
            -scheme FloatingSeconds \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

      - name: Package IPA
        working-directory: FloatingSecondsBuildPayload
        run: |
          rm -rf Payload FloatingSeconds.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FloatingSeconds.app Payload/
          zip -qry FloatingSeconds.ipa Payload
          test -f FloatingSeconds.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FloatingSeconds-IPA-v1.6
          path: FloatingSecondsBuildPayload/FloatingSeconds.ipa
          if-no-files-found: error
