name: Build Floating Seconds IPA

on:
  push:
    branches:
      - floating-seconds-build
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and patch project
        run: |
          git show 7d9934ac5f86c60e0e256c4016e992af48e9619b:floating-seconds-project.zip.b64 > original-project.b64
          python3 - <<'PY'
          import base64, pathlib
          src = pathlib.Path('original-project.b64').read_text().strip()
          pathlib.Path('floating-seconds-project.zip').write_bytes(base64.b64decode(src))
          PY
          unzip -q floating-seconds-project.zip
          python3 - <<'PY'
          from pathlib import Path
          p = Path('FloatingSecondsBuildPayload/FloatingSeconds/PiPClockManager.swift')
          s = p.read_text()
          old = 'func pictureInPictureController(_ pictureInPictureController: AVPictureInPictureController, skipByInterval skipInterval: CMTime, completionHandler: @escaping () -> Void) {\n        completionHandler()\n    }'
          new = 'func pictureInPictureController(_ pictureInPictureController: AVPictureInPictureController, skipByInterval skipInterval: CMTime, completion: @escaping () -> Void) {\n        completion()\n    }'
          if old not in s:
              raise SystemExit('Expected PiP delegate code was not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: FloatingSecondsBuildPayload
        run: xcodegen generate

      - name: Build unsigned iPhone app
        working-directory: FloatingSecondsBuildPayload
        run: |
          xcodebuild \
            -project FloatingSeconds.xcodeproj \
            -scheme FloatingSeconds \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

      - name: Package IPA
        working-directory: FloatingSecondsBuildPayload
        run: |
          rm -rf Payload FloatingSeconds.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FloatingSeconds.app Payload/
          zip -qry FloatingSeconds.ipa Payload
          test -f FloatingSeconds.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FloatingSeconds-IPA
          path: FloatingSecondsBuildPayload/FloatingSeconds.ipa
          if-no-files-found: error
