name: Build Taskbar Icon Size Tuner

on:
  workflow_dispatch:
  push:
    branches: [taskbar-icon-size-temp-build]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare v1.1 sources
        shell: pwsh
        working-directory: taskbar-icon-size-tuner
        run: |
          $native = Get-Content TaskbarIconHookV10.cpp -Raw
          $native = $native.Replace('V10', 'V11')
          $native = $native.Replace('0x54493130', '0x54493131')
          $native = $native.Replace('0x544C3130', '0x544C3131')
          $native = $native.Replace('0x54533130', '0x54533131')
          $native = $native.Replace('if (requested < 1) requested = 1;`r`n    if (requested > 100) requested = 100;', 'if (requested < 20) requested = 16;`r`n    else if (requested < 29) requested = 24;`r`n    else requested = 32;')
          $native = $native.Replace('RDW_INVALIDATE | RDW_ERASE | RDW_UPDATENOW', 'RDW_INVALIDATE | RDW_UPDATENOW')
          $native = $native.Replace('`r`n', [Environment]::NewLine)
          Set-Content TaskbarIconHookV11.build.cpp $native -Encoding utf8

          $ui = Get-Content ProgramV10.cs -Raw
          $ui = $ui.Replace('V10', 'V11')
          $ui = $ui.Replace('v1.0', 'v1.1')
          $ui = $ui.Replace('TaskbarIconHook-1.0.dll', 'TaskbarIconHook-1.1.dll')
          $ui = $ui.Replace('SetupNumber(iconSizeBox, 1, 100, 18, 196, 103, 78);', 'SetupNumber(iconSizeBox, 16, 32, 24, 196, 103, 78);`r`n            iconSizeBox.Increment = 8;')
          $ui = $ui.Replace('AddLabel("logical px", 282, 106, 9F, false);', 'AddLabel("safe px (16 / 24 / 32)", 282, 106, 9F, false);')
          $ui = $ui.Replace('v1.1 resizes both the icon image and its real taskbar slot, so smaller values\nmove icons left and make room for more. Changes are live; no Apply button.', 'v1.1 uses Windows-safe icon sizes so icons always render, while the real taskbar slot\ncan still be made narrower to move icons left and fit more. Changes are live.')
          $ui = $ui.Replace('smallButtons.Text = "Use Windows small taskbar buttons";', 'smallButtons.Text = "Windows small-icon mode (automatic for 16 px)";')
          $ui = $ui.Replace('Controls.Add(smallButtons);', 'smallButtons.Enabled = false;`r`n            Controls.Add(smallButtons);')
          $ui = $ui.Replace('disable7ttLarge.Text = "Disable 7+ Taskbar Tweaker w10_large_icons while custom sizing is active";', 'disable7ttLarge.Text = "Keep 7+ Taskbar Tweaker large-icon override off (prevents conflicts)";')
          $ui = $ui.Replace('disable7ttLarge.Checked = true;', 'disable7ttLarge.Checked = true;`r`n            disable7ttLarge.Enabled = false;')
          $ui = $ui.Replace('SetNumberIfValid(iconSizeBox, (int)ReadDword(AppKey, "IconSizeV11", ReadDword(AppKey, "HookIconSizeV9", 18)));', 'SetNumberIfValid(iconSizeBox, (int)ReadDword(AppKey, "IconSizeV11", 24));')
          $oldApply = 'WriteDword(ExplorerAdvancedKey, "TaskbarSmallIcons", smallButtons.Checked ? 1u : 0u);'
          $newApply = 'int requestedIcon = (int)iconSizeBox.Value;`r`n                int safeIcon = requestedIcon < 20 ? 16 : (requestedIcon < 29 ? 24 : 32);`r`n                loading = true;`r`n                iconSizeBox.Value = safeIcon;`r`n                smallButtons.Checked = safeIcon == 16;`r`n                disable7ttLarge.Checked = true;`r`n                loading = false;`r`n                WriteDword(ExplorerAdvancedKey, "TaskbarSmallIcons", safeIcon == 16 ? 1u : 0u);'
          $ui = $ui.Replace($oldApply, $newApply)
          $ui = $ui.Replace('WriteDword(AppKey, "IconSizeV11", (uint)iconSizeBox.Value);', 'WriteDword(AppKey, "IconSizeV11", (uint)safeIcon);')
          $ui = $ui.Replace('WriteDword(AppKey, "HookEnabledV9", 0);', 'WriteDword(AppKey, "HookEnabledV9", 0);`r`n            WriteDword(AppKey, "HookEnabledV10", 0);')
          $ui = $ui.Replace('Applied immediately. Icon image + taskbar slot + Search refresh sent.', 'Applied. Safe icon image + compact taskbar slot + Search refresh sent.')
          $ui = $ui.Replace('Icon redraw is forced immediately now; you should not need to hover over icons to update them.', 'Safe rendering avoids blank/stretched icons. Taskbar redraw is still forced immediately.')
          $ui = $ui.Replace('`r`n', [Environment]::NewLine)
          Set-Content ProgramV11.build.cs $ui -Encoding utf8

      - name: Build native taskbar hook
        shell: pwsh
        working-directory: taskbar-icon-size-tuner
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools not found' }
          $cmd = 'call "' + $vs + '\VC\Auxiliary\Build\vcvars64.bat" && cl /nologo /LD /O2 /MT /EHsc /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 TaskbarIconHookV11.build.cpp /link /OUT:bin\TaskbarIconHook-1.1.dll user32.lib advapi32.lib comctl32.lib gdi32.lib'
          cmd /c $cmd
          if ($LASTEXITCODE -ne 0) { throw 'Native hook compilation failed.' }

      - name: Generate app icon
        shell: pwsh
        working-directory: taskbar-icon-size-tuner
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeIconCleanup {
              [DllImport("user32.dll")] public static extern bool DestroyIcon(IntPtr hIcon);
          }
          '@
          $bmp = New-Object System.Drawing.Bitmap 64,64
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::Transparent)
          $bg = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(255, 35, 125, 210))
          $white = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::White)
          $g.FillRectangle($bg, 5, 10, 54, 44)
          $g.FillRectangle($white, 12, 18, 40, 6)
          $g.FillRectangle($white, 12, 29, 28, 6)
          $g.FillRectangle($white, 12, 40, 34, 6)
          $pen = New-Object System.Drawing.Pen ([System.Drawing.Color]::White), 3
          $g.DrawLine($pen, 48, 27, 56, 35)
          $g.DrawLine($pen, 56, 35, 48, 43)
          $hIcon = $bmp.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($hIcon)
          $fs = [System.IO.File]::Create((Join-Path (Get-Location) 'AppIcon.ico'))
          $icon.Save($fs)
          $fs.Close()
          [NativeIconCleanup]::DestroyIcon($hIcon) | Out-Null
          $pen.Dispose(); $white.Dispose(); $bg.Dispose(); $g.Dispose(); $bmp.Dispose()

      - name: Compile portable EXE
        shell: pwsh
        working-directory: taskbar-icon-size-tuner
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "C# compiler not found at $csc" }
          & $csc /nologo /target:winexe /platform:x64 /optimize+ /win32icon:AppIcon.ico /out:bin\TaskbarIconSizeTuner.exe /resource:bin\TaskbarIconHook-1.1.dll,TaskbarIconHook.dll /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll ProgramV11.build.cs
          if ($LASTEXITCODE -ne 0) { throw "C# compilation failed." }

      - name: Locate or install Inno Setup
        id: inno
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer
        shell: pwsh
        working-directory: taskbar-icon-size-tuner
        run: '& "${{ steps.inno.outputs.iscc }}" "installer.iss"'

      - name: Stage portable and checksums
        shell: pwsh
        working-directory: taskbar-icon-size-tuner
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "bin\TaskbarIconSizeTuner.exe" "dist\Taskbar-Icon-Size-Tuner-Portable-1.1.0.exe" -Force
          Get-ChildItem dist\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: Taskbar-Icon-Size-Tuner-Windows-x64-v1.1
          path: |
            taskbar-icon-size-tuner/dist/Taskbar-Icon-Size-Tuner-Setup-1.1.0.exe
            taskbar-icon-size-tuner/dist/Taskbar-Icon-Size-Tuner-Setup-1.1.0.exe.sha256
            taskbar-icon-size-tuner/dist/Taskbar-Icon-Size-Tuner-Portable-1.1.0.exe
            taskbar-icon-size-tuner/dist/Taskbar-Icon-Size-Tuner-Portable-1.1.0.exe.sha256
          if-no-files-found: error
