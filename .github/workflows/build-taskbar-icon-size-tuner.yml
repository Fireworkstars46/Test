name: Build Taskbar Icon Size Tuner

on:
  workflow_dispatch:
  push:
    branches: [taskbar-icon-size-temp-build]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile portable EXE
        shell: pwsh
        working-directory: taskbar-icon-size-tuner
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "C# compiler not found at $csc" }
          & $csc /nologo /target:winexe /platform:x64 /optimize+ /out:bin\TaskbarIconSizeTuner.exe /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll Program.cs
          if ($LASTEXITCODE -ne 0) { throw "C# compilation failed." }

      - name: Locate or install Inno Setup
        id: inno
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer
        shell: pwsh
        working-directory: taskbar-icon-size-tuner
        run: '& "${{ steps.inno.outputs.iscc }}" "installer.iss"'

      - name: Stage portable and checksums
        shell: pwsh
        working-directory: taskbar-icon-size-tuner
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "bin\TaskbarIconSizeTuner.exe" "dist\Taskbar-Icon-Size-Tuner-Portable-0.1.0.exe" -Force
          Get-ChildItem dist\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: Taskbar-Icon-Size-Tuner-Windows-x64
          path: |
            taskbar-icon-size-tuner/dist/*.exe
            taskbar-icon-size-tuner/dist/*.sha256
          if-no-files-found: error
