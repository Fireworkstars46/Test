name: Build Hey ChatGPT Assist v1.8 APK

on:
  push:
    branches:
      - hey-chatgpt-assist-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HeyChatGPTAssist

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare v1.8 source
        run: |
          python3 prepare_v18.py
          python3 fix_v18_output.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeyChatGPTAssist-v1.8-apk
          path: HeyChatGPTAssist/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Stage APK signing tools
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" signing-tools/
          cp -r "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib" signing-tools/

      - name: Upload APK signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35
          path: HeyChatGPTAssist/signing-tools
          if-no-files-found: error
