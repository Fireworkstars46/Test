name: Build Hey ChatGPT Assist APK

on:
  push:
    branches:
      - hey-chatgpt-assist-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HeyChatGPTAssist

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare v1.6 filtered assistant text capture
        run: |
          cat > app/src/main/java/com/example/heychatgptassist/ChatGPTTextAccessibilityService.java <<'JAVA'
          package com.example.heychatgptassist;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.AccessibilityServiceInfo;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.view.accessibility.AccessibilityWindowInfo;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;

          public class ChatGPTTextAccessibilityService extends AccessibilityService {
              public static final String KEY_LAST_ASSIST_TRIGGER_MS = "last_assist_trigger_ms";
              public static final String KEY_LAST_CAPTURED_TEXT = "last_captured_response_text";
              public static final String KEY_LAST_WINDOW_DEBUG = "last_assistant_window_debug";
              public static final String KEY_TEMP_REQUEST_MS = "temp_voice_request_ms";
              public static final String KEY_TEMP_AUTOMATION_STATUS = "temp_voice_automation_status";

              private static final String CHATGPT_PACKAGE = "com.openai.chatgpt";
              private static final String OWN_PACKAGE = "com.example.heychatgptassist";
              private static final long ASSIST_SESSION_WINDOW_MS = 2L * 60L * 1000L;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Set<String> previousSnapshot = new LinkedHashSet<>();
              private final LinkedHashMap<String, Integer> eventCounts = new LinkedHashMap<>();
              private final LinkedHashMap<String, String> eventSamples = new LinkedHashMap<>();
              private long lastTriggerSeen = -1L;
              private String lastDisplayed = "";

              private WindowManager windowManager;
              private View overlayView;
              private TextView overlayText;
              private final Runnable hideRunnable = this::hideOverlay;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  AccessibilityServiceInfo info = getServiceInfo();
                  if (info != null) {
                      info.flags |= AccessibilityServiceInfo.FLAG_RETRIEVE_INTERACTIVE_WINDOWS;
                      info.flags |= AccessibilityServiceInfo.FLAG_INCLUDE_NOT_IMPORTANT_VIEWS;
                      info.flags |= AccessibilityServiceInfo.FLAG_REPORT_VIEW_IDS;
                      setServiceInfo(info);
                  }
                  prefs().edit().putString(KEY_TEMP_AUTOMATION_STATUS,
                          "v1.6: filtered popup text capture; Temporary automation disabled").apply();
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null) return;
                  if (!isResponseTextEnabled()) {
                      hideOverlay();
                      return;
                  }
                  if (!isRecentAssistSession()) return;

                  long trigger = prefs().getLong(KEY_LAST_ASSIST_TRIGGER_MS, 0L);
                  if (trigger != lastTriggerSeen) {
                      lastTriggerSeen = trigger;
                      previousSnapshot.clear();
                      eventCounts.clear();
                      eventSamples.clear();
                      lastDisplayed = "";
                      hideOverlay();
                  }

                  String eventPackage = stringValue(event.getPackageName());
                  if (OWN_PACKAGE.equals(eventPackage)) return;

                  recordEvent(eventPackage, event);

                  List<String> windowPackages = new ArrayList<>();
                  List<String> markedWindowStrings = new ArrayList<>();
                  collectMarkedAssistantWindows(windowPackages, markedWindowStrings);

                  List<String> eventStrings = new ArrayList<>();
                  boolean trustedEvent = isTrustedAssistantPackage(eventPackage);
                  boolean markedSystemEvent = false;
                  AccessibilityNodeInfo source = null;
                  try { source = event.getSource(); } catch (Throwable ignored) {}

                  if (trustedEvent) {
                      collectEventStrings(event, eventStrings);
                      if (source != null) {
                          int[] visited = new int[] {0};
                          collectStrings(source, eventStrings, visited);
                      }
                  } else if (isSystemUiPackage(eventPackage) && source != null && subtreeHasAssistantMarker(source)) {
                      markedSystemEvent = true;
                      collectEventStrings(event, eventStrings);
                      int[] visited = new int[] {0};
                      collectStrings(source, eventStrings, visited);
                  }

                  List<String> candidates = new ArrayList<>();
                  candidates.addAll(eventStrings);
                  candidates.addAll(markedWindowStrings);
                  updateDebug(eventPackage, windowPackages, candidates, trustedEvent || markedSystemEvent);

                  if (!(trustedEvent || markedSystemEvent) && markedWindowStrings.isEmpty()) {
                      previousSnapshot.clear();
                      return;
                  }

                  String candidate = chooseCandidate(candidates, eventStrings);
                  previousSnapshot.clear();
                  previousSnapshot.addAll(candidates);

                  if (!TextUtils.isEmpty(candidate) && !candidate.equals(lastDisplayed)) {
                      lastDisplayed = candidate;
                      prefs().edit().putString(KEY_LAST_CAPTURED_TEXT, candidate).apply();
                      showOverlay(candidate);
                  }
              }

              private SharedPreferences prefs() {
                  return getSharedPreferences(MainActivity.PREFS, MODE_PRIVATE);
              }

              private boolean isResponseTextEnabled() {
                  return prefs().getBoolean(MainActivity.KEY_RESPONSE_TEXT_ENABLED, true);
              }

              private boolean isRecentAssistSession() {
                  long trigger = prefs().getLong(KEY_LAST_ASSIST_TRIGGER_MS, 0L);
                  if (trigger <= 0L) return false;
                  long age = System.currentTimeMillis() - trigger;
                  return age >= 0L && age <= ASSIST_SESSION_WINDOW_MS;
              }

              private String stringValue(CharSequence value) {
                  return value == null ? "" : value.toString();
              }

              private void recordEvent(String pkg, AccessibilityEvent event) {
                  String key = pkg == null || pkg.isEmpty() ? "(none)" : pkg;
                  Integer count = eventCounts.get(key);
                  eventCounts.put(key, count == null ? 1 : count + 1);
                  if (eventCounts.size() > 12) {
                      String first = eventCounts.keySet().iterator().next();
                      eventCounts.remove(first);
                      eventSamples.remove(first);
                  }

                  if (!eventSamples.containsKey(key)) {
                      List<String> sample = new ArrayList<>();
                      collectEventStrings(event, sample);
                      for (String s : sample) {
                          if (!isSystemChrome(s) && s.length() >= 4) {
                              eventSamples.put(key, truncate(s, 70));
                              break;
                          }
                      }
                  }
              }

              private boolean isTrustedAssistantPackage(String pkg) {
                  if (pkg == null || pkg.isEmpty() || OWN_PACKAGE.equals(pkg)) return false;
                  if (CHATGPT_PACKAGE.equals(pkg)) return true;
                  String p = pkg.toLowerCase(Locale.US);
                  return p.contains("openai") || (p.contains("assistant") && !p.contains("sidegesture"));
              }

              private boolean isSystemUiPackage(String pkg) {
                  return "com.android.systemui".equals(pkg) || "android".equals(pkg);
              }

              private void collectMarkedAssistantWindows(List<String> packages, List<String> strings) {
                  List<AccessibilityWindowInfo> windows = getWindows();
                  if (windows == null) return;
                  for (AccessibilityWindowInfo window : windows) {
                      if (window == null) continue;
                      AccessibilityNodeInfo root = null;
                      try { root = window.getRoot(); } catch (Throwable ignored) {}
                      if (root == null) continue;
                      String pkg = stringValue(root.getPackageName());
                      if (!pkg.isEmpty() && !packages.contains(pkg)) packages.add(pkg);
                      if (OWN_PACKAGE.equals(pkg)) continue;

                      boolean trusted = isTrustedAssistantPackage(pkg);
                      boolean marked = trusted || subtreeHasAssistantMarker(root);
                      if (!marked) continue;
                      int[] visited = new int[] {0};
                      collectStrings(root, strings, visited);
                  }
              }

              private boolean subtreeHasAssistantMarker(AccessibilityNodeInfo root) {
                  if (root == null) return false;
                  ArrayList<AccessibilityNodeInfo> queue = new ArrayList<>();
                  queue.add(root);
                  int index = 0;
                  int visited = 0;
                  while (index < queue.size() && visited < 350) {
                      AccessibilityNodeInfo node = queue.get(index++);
                      visited++;
                      if (node == null) continue;
                      String raw = (stringValue(node.getText()) + " " +
                              stringValue(node.getContentDescription()) + " " +
                              stringValue(node.getHintText())).toLowerCase(Locale.US);
                      if (raw.contains("chatgpt") || raw.contains("tap to interrupt") ||
                              raw.contains("voice conversation") || raw.contains("end voice mode") ||
                              raw.contains("openai")) return true;
                      int count = node.getChildCount();
                      for (int i = 0; i < count && queue.size() < 400; i++) {
                          AccessibilityNodeInfo child = node.getChild(i);
                          if (child != null) queue.add(child);
                      }
                  }
                  return false;
              }

              private void collectEventStrings(AccessibilityEvent event, List<String> out) {
                  if (event.getText() != null) {
                      for (CharSequence cs : event.getText()) addCleanString(out, cs);
                  }
                  addCleanString(out, event.getContentDescription());
              }

              private void collectStrings(AccessibilityNodeInfo node, List<String> out, int[] visited) {
                  if (node == null || visited[0] > 650) return;
                  visited[0]++;
                  if (node.isVisibleToUser()) {
                      addCleanString(out, node.getText());
                      addCleanString(out, node.getContentDescription());
                      addCleanString(out, node.getHintText());
                  }
                  int count = node.getChildCount();
                  for (int i = 0; i < count && visited[0] <= 650; i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child != null) collectStrings(child, out, visited);
                  }
              }

              private void addCleanString(List<String> out, CharSequence value) {
                  if (value == null) return;
                  String s = clean(value.toString());
                  if (s.isEmpty() || isSystemChrome(s)) return;
                  if (!out.contains(s)) out.add(s);
              }

              private String clean(String raw) {
                  if (raw == null) return "";
                  String s = raw.replace('\u00a0', ' ').replaceAll("\\s+", " ").trim();
                  if (s.length() > 2600) s = s.substring(0, 2600);
                  return s;
              }

              private boolean isSystemChrome(String text) {
                  String s = text.toLowerCase(Locale.US).trim();
                  if (s.isEmpty()) return true;
                  String[] exact = new String[] {
                          "chatgpt", "close", "cancel", "stop", "done", "back", "send",
                          "listening", "thinking", "speaking", "voice", "mute", "unmute",
                          "camera", "keyboard", "settings", "end", "end voice mode",
                          "tap to interrupt", "tap to stop", "start voice mode", "temporary",
                          "microphone", "more options", "drag handle", "recents", "home",
                          "notifications", "notification shade", "quick settings", "device controls"
                  };
                  for (String item : exact) if (s.equals(item)) return true;
                  if (s.startsWith("wifi ") || s.startsWith("wi-fi ") || s.startsWith("mobile data ")) return true;
                  if (s.contains(" bars") && (s.contains("wifi") || s.contains("signal"))) return true;
                  if (s.matches("\\d{1,3}%")) return true;
                  if (s.matches("\\d{1,2}:\\d{2}( [ap]m)?")) return true;
                  if (s.startsWith("battery ") || s.startsWith("bluetooth ") || s.startsWith("alarm ")) return true;
                  if (s.startsWith("double tap to")) return true;
                  if (s.startsWith("button,")) return true;
                  if (s.startsWith("image,")) return true;
                  return false;
              }

              private String chooseCandidate(List<String> allStrings, List<String> eventStrings) {
                  String best = "";
                  int bestScore = Integer.MIN_VALUE;
                  LinkedHashSet<String> all = new LinkedHashSet<>();
                  all.addAll(eventStrings);
                  all.addAll(allStrings);

                  for (String s : all) {
                      if (TextUtils.isEmpty(s) || isSystemChrome(s) || s.length() < 5) continue;
                      int score = Math.min(s.length(), 500);
                      if (eventStrings.contains(s)) score += 1100;
                      if (!previousSnapshot.contains(s)) score += 700;
                      if (!lastDisplayed.isEmpty()) {
                          if (s.startsWith(lastDisplayed)) score += 550;
                          else if (lastDisplayed.startsWith(s)) score += 250;
                      }
                      if (s.length() >= 12) score += 120;
                      if (s.endsWith("?") && s.length() < 180) score -= 250;
                      if (score > bestScore) {
                          bestScore = score;
                          best = s;
                      }
                  }
                  return bestScore < 750 ? "" : best;
              }

              private void updateDebug(String eventPackage, List<String> windows,
                                       List<String> candidateStrings, boolean trusted) {
                  StringBuilder sb = new StringBuilder();
                  sb.append("Last event: ").append(eventPackage.isEmpty() ? "(none)" : eventPackage);
                  sb.append(trusted ? " [capture-eligible]" : " [ignored for text]");
                  sb.append(" | Seen events: ");
                  if (eventCounts.isEmpty()) sb.append("(none)");
                  else {
                      boolean first = true;
                      for (Map.Entry<String, Integer> e : eventCounts.entrySet()) {
                          if (!first) sb.append(", ");
                          first = false;
                          sb.append(e.getKey()).append("×").append(e.getValue());
                      }
                  }
                  sb.append(" | Windows: ");
                  if (windows.isEmpty()) sb.append("(none)");
                  else {
                      for (int i = 0; i < windows.size(); i++) {
                          if (i > 0) sb.append(", ");
                          sb.append(windows.get(i));
                      }
                  }
                  sb.append(" | Candidate items: ").append(candidateStrings.size());
                  if (!eventSamples.isEmpty()) {
                      sb.append(" | Event samples: ");
                      boolean first = true;
                      for (Map.Entry<String, String> e : eventSamples.entrySet()) {
                          if (!first) sb.append(" / ");
                          first = false;
                          sb.append(e.getKey()).append(": ").append(e.getValue());
                      }
                  }
                  String debug = sb.toString();
                  if (debug.length() > 1100) debug = debug.substring(0, 1100);
                  prefs().edit().putString(KEY_LAST_WINDOW_DEBUG, debug).apply();
              }

              private String truncate(String s, int max) {
                  if (s == null) return "";
                  return s.length() <= max ? s : s.substring(0, max) + "…";
              }

              private void showOverlay(String text) {
                  if (windowManager == null) return;
                  if (overlayView == null) createOverlay();
                  if (overlayText != null) overlayText.setText(text);
                  handler.removeCallbacks(hideRunnable);
                  handler.postDelayed(hideRunnable, 20000L);
              }

              private void createOverlay() {
                  LinearLayout panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(dp(18), dp(12), dp(14), dp(14));

                  GradientDrawable background = new GradientDrawable();
                  background.setColor(Color.argb(238, 28, 28, 30));
                  background.setCornerRadius(dp(22));
                  panel.setBackground(background);
                  panel.setElevation(dp(10));

                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);

                  TextView title = new TextView(this);
                  title.setText("ChatGPT");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(14);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  header.addView(title, new LinearLayout.LayoutParams(0,
                          LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                  TextView close = new TextView(this);
                  close.setText("×");
                  close.setTextColor(Color.LTGRAY);
                  close.setTextSize(26);
                  close.setGravity(Gravity.CENTER);
                  close.setPadding(dp(10), 0, dp(4), 0);
                  close.setOnClickListener(v -> hideOverlay());
                  header.addView(close, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT));
                  panel.addView(header);

                  overlayText = new TextView(this);
                  overlayText.setTextColor(Color.WHITE);
                  overlayText.setTextSize(18);
                  overlayText.setLineSpacing(0f, 1.08f);
                  overlayText.setMaxLines(9);
                  overlayText.setEllipsize(TextUtils.TruncateAt.END);
                  overlayText.setPadding(0, dp(4), 0, 0);
                  panel.addView(overlayText, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT));

                  Rect bounds = windowManager.getCurrentWindowMetrics().getBounds();
                  int width = Math.max(dp(220), bounds.width() - dp(24));
                  WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          width,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                                  WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL |
                                  WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT);
                  params.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  params.y = dp(54);

                  try {
                      windowManager.addView(panel, params);
                      overlayView = panel;
                  } catch (Throwable ignored) {
                      overlayView = null;
                      overlayText = null;
                  }
              }

              private void hideOverlay() {
                  handler.removeCallbacks(hideRunnable);
                  if (windowManager != null && overlayView != null) {
                      try { windowManager.removeView(overlayView); } catch (Throwable ignored) {}
                  }
                  overlayView = null;
                  overlayText = null;
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              @Override public void onInterrupt() { hideOverlay(); }

              @Override public void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  hideOverlay();
                  super.onDestroy();
              }
          }
          JAVA

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewTextChanged|typeWindowsChanged|typeViewFocused"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="25"
              android:canRetrieveWindowContent="true"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows" />
          XML

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Keep the known WakeListener source fixes and always use the original
          # Side-button-style assistant popup path.
          p = Path('app/src/main/java/com/example/heychatgptassist/WakeListenerService.java')
          s = p.read_text()
          anchor = '    private Intent recognizerIntent;\n    private final Handler handler = new Handler(Looper.getMainLooper());'
          replacement = ('    private Intent recognizerIntent;\n'
                         '    private boolean stopping = false;\n'
                         '    private boolean pausedForAssistant = false;\n'
                         '    private final Handler handler = new Handler(Looper.getMainLooper());')
          if anchor in s:
              s = s.replace(anchor, replacement, 1)
          duplicate = ('\n    private boolean stopping = false;\n'
                       '    private boolean pausedForAssistant = false;\n'
                       '    private boolean forceSystemRecognizer = false;')
          if duplicate in s:
              s = s.replace(duplicate, '\n    private boolean forceSystemRecognizer = false;', 1)

          trigger_pattern = re.compile(
              r'    private void triggerAssistant\(\) \{\n'
              r'        if \(pausedForAssistant \|\| stopping\) return;\n'
              r'        if \(getTemporaryVoiceEnabled\(\)\) triggerTemporaryVoice\(\);\n'
              r'        else triggerNormalAssistant\(\);\n'
              r'    \}')
          replacement = ('    private void triggerAssistant() {\n'
                         '        if (pausedForAssistant || stopping) return;\n'
                         '        triggerNormalAssistant();\n'
                         '    }')
          s, count = trigger_pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('triggerAssistant block not found')
          p.write_text(s)

          # UI text/status for v1.6.
          p = Path('app/src/main/java/com/example/heychatgptassist/MainActivity.java')
          s = p.read_text()
          s = s.replace('Hey ChatGPT Assist v1.3', 'Hey ChatGPT Assist v1.6')
          s = s.replace(
              'Always-listening assistant with smoother microphone handling, optional response text, and an experimental Temporary Voice mode that keeps finished Voice chats out of normal history.',
              'Always-listening assistant with smoother microphone handling and filtered Siri-style response text capture. Wake activation keeps the original Side-button-style ChatGPT assistant popup.')
          init_anchor = '        Shizuku.addRequestPermissionResultListener(shizukuPermissionListener);\n'
          if init_anchor in s:
              s = s.replace(init_anchor, init_anchor +
                  '        prefs().edit().putBoolean(KEY_TEMPORARY_VOICE_ENABLED, false).apply();\n', 1)
          s = s.replace(
              'When ChatGPT exposes its live response text through Android Accessibility, the companion can mirror it into a small panel. The Accessibility service is restricted to the ChatGPT app.',
              'v1.6 ignores status-bar/navigation text such as Wi-Fi, battery, Home, and Recents. It only displays text from ChatGPT/assistant events or a system window that contains a ChatGPT/Voice marker. The diagnostic keeps a rolling list of packages seen during the wake session.')
          s = s.replace(
              'When enabled, saying the wake phrase opens ChatGPT, starts a fresh Temporary chat, and then starts Voice. It uses the same Accessibility companion. Voice is not started unless the helper reaches the Temporary control first. This mode opens the ChatGPT app rather than the small Android assistant popup because ChatGPT does not expose a supported Temporary-mode flag for that popup.',
              'Automatic Temporary Chat is disabled so the wake phrase always keeps the small assistant popup. Temporary Chat still needs to be started manually in the normal ChatGPT app.')
          s = s.replace('        temporaryVoiceToggle.setText("Always use Temporary Chat for wake-phrase Voice");',
                        '        temporaryVoiceToggle.setText("Automatic Temporary Chat unavailable with assistant popup");')
          s = s.replace('        temporaryVoiceToggle.setChecked(prefs().getBoolean(KEY_TEMPORARY_VOICE_ENABLED, false));',
                        '        temporaryVoiceToggle.setChecked(false);\n        temporaryVoiceToggle.setEnabled(false);')
          listener_pattern = re.compile(
              r'\n        temporaryVoiceToggle\.setOnCheckedChangeListener\(\(buttonView, checked\) -> \{\n'
              r'            prefs\(\)\.edit\(\)\.putBoolean\(KEY_TEMPORARY_VOICE_ENABLED, checked\)\.apply\(\);\n'
              r'            updateTemporaryVoiceStatus\(\);\n'
              r'        \}\);')
          s = listener_pattern.sub('', s, count=1)
          s = s.replace(
              'One-time setup: turn on ‘Hey ChatGPT Assist response text’ in Accessibility. That same service handles both response-text mirroring and Temporary Voice automation.',
              'One-time setup: turn on ‘Hey ChatGPT Assist response text’ in Accessibility. v1.6 listens broadly only during a recent wake session, then filters capture aggressively so normal System UI text is not shown.')
          s = s.replace(
              'Normal mode keeps the side-button-style Android assistant behavior. Temporary Voice is separate and only takes over the wake action while its toggle is enabled.',
              'Wake-phrase activation always keeps the side-button-style Android assistant popup. It will not launch the full ChatGPT app automatically.')

          marker = '        companionStatus.setText(text);'
          diagnostic = ('        String debug = prefs().getString(ChatGPTTextAccessibilityService.KEY_LAST_WINDOW_DEBUG, "");\n'
                        '        if (!debug.isEmpty()) text += "\\nAssistant capture debug: " + debug;\n'
                        '        companionStatus.setText(text);')
          if marker not in s:
              raise SystemExit('companion status marker not found')
          s = s.replace(marker, diagnostic, 1)
          p.write_text(s)

          p = Path('app/build.gradle')
          s = p.read_text()
          if 'versionCode 13' not in s or 'versionName "1.3"' not in s:
              raise SystemExit('Expected v1.3 version fields not found')
          s = s.replace('versionCode 13', 'versionCode 16', 1)
          s = s.replace('versionName "1.3"', 'versionName "1.6"', 1)
          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeyChatGPTAssist-v1.6-apk
          path: HeyChatGPTAssist/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Stage APK signing tools
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" signing-tools/
          cp -r "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib" signing-tools/

      - name: Upload APK signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35
          path: HeyChatGPTAssist/signing-tools
          if-no-files-found: error
