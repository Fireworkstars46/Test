name: Build Hey ChatGPT Assist APK

on:
  push:
    branches:
      - hey-chatgpt-assist-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HeyChatGPTAssist

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare safer Temporary selection check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/heychatgptassist/ChatGPTTextAccessibilityService.java')
          s = p.read_text()
          old = 'if (label.contains("selected") || label.contains("on") || label.contains("active")) return true;'
          new = 'if (label.matches(".*\\\\b(selected|active|enabled|on)\\\\b.*")) return true;'
          if old not in s:
              raise SystemExit('Temporary selection line not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeyChatGPTAssist-v1.3-apk
          path: HeyChatGPTAssist/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Stage APK signing tools
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" signing-tools/
          cp -r "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib" signing-tools/

      - name: Upload APK signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35
          path: HeyChatGPTAssist/signing-tools
          if-no-files-found: error
