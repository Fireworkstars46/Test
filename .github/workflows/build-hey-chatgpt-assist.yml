name: Build Hey ChatGPT Assist APK

on:
  push:
    branches:
      - hey-chatgpt-assist-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HeyChatGPTAssist

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare v0.9 fast re-arm build
        run: |
          sed -i 's/private static final long BUSY_RESTART_DELAY_MS = 500;/private static final long BUSY_RESTART_DELAY_MS = 100;/' app/src/main/java/com/example/heychatgptassist/WakeListenerService.java
          sed -i 's/startListeningSoon(1000);/startListeningSoon(250);/' app/src/main/java/com/example/heychatgptassist/WakeListenerService.java
          sed -i 's/versionCode 8/versionCode 9/' app/build.gradle
          sed -i 's/versionName "0.8"/versionName "0.9"/' app/build.gradle
          sed -i 's/Hey ChatGPT Assist v0.8/Hey ChatGPT Assist v0.9/' app/src/main/java/com/example/heychatgptassist/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeyChatGPTAssist-v0.9-apk
          path: HeyChatGPTAssist/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
