name: Build Crash Monitor

on:
  push:
    branches:
      - chatgpt-crash-monitor
    paths:
      - 'crash-monitor/**'
      - '.github/workflows/chatgpt-crash-monitor.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: crash-monitor
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp crash-monitor/app/build/outputs/apk/debug/app-debug.apk CrashMonitor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CrashMonitor-APK
          path: CrashMonitor.apk
          if-no-files-found: error
