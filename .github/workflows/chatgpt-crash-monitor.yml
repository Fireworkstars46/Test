name: Build Crash Monitor

on:
  push:
    branches:
      - chatgpt-crash-monitor
    paths:
      - 'crash-monitor/**'
      - '.github/workflows/chatgpt-crash-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore permanent signing key
        uses: actions/download-artifact@v4
        with:
          name: CrashMonitor-Permanent-Build
          path: signing-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35200340285

      - name: Configure permanent signing
        shell: bash
        run: |
          set -euo pipefail
          cp signing-source/CrashMonitor-Permanent-Key.jks crash-monitor/CrashMonitor-Permanent-Key.jks
          PASS=$(awk -F': ' '/^Keystore password:/ {print $2}' signing-source/CrashMonitor-Key-Info.txt)
          test -n "$PASS"
          echo "CRASHMONITOR_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "CRASHMONITOR_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "CRASHMONITOR_KEY_ALIAS=crashmonitor" >> "$GITHUB_ENV"
          echo "CRASHMONITOR_KEYSTORE=$GITHUB_WORKSPACE/crash-monitor/CrashMonitor-Permanent-Key.jks" >> "$GITHUB_ENV"

      - name: Build permanently signed APK
        working-directory: crash-monitor
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signing certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p icon-build
          cp crash-monitor/app/build/outputs/apk/release/app-release.apk icon-build/CrashMonitor-Permanent-Icon.apk
          keytool -list -v \
            -keystore crash-monitor/CrashMonitor-Permanent-Key.jks \
            -storepass "$CRASHMONITOR_STORE_PASSWORD" \
            -alias crashmonitor | grep -E "SHA256:|Valid from:" > icon-build/CrashMonitor-Key-Fingerprint.txt
          cat icon-build/CrashMonitor-Key-Fingerprint.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CrashMonitor-Permanent-Icon-Build
          path: icon-build/*
          if-no-files-found: error
