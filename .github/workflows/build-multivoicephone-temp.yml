name: Temporary MultiVoiceHub Phone APK Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary app branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-multivoicephone-v2-20260906

      - name: Unpack app source
        run: unzip -q mvphone-source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: MultiVoiceHubPhone
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiVoiceHub-Phone-APK
          path: MultiVoiceHubPhone/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
