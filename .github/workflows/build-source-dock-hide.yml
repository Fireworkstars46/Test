name: Build Windows plugin + installer

on:
  workflow_dispatch:
  push:
    branches: [obs-source-dock-hide-temp-build]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022

    steps:
      - name: Checkout Source Dock Hide
        uses: actions/checkout@v4

      - name: Patch v0.6 source context menu and bottom counter
        shell: pwsh
        working-directory: obs-source-dock-hide
        run: |
          $pluginPath = "src/plugin-main.cpp"
          $plugin = Get-Content $pluginPath -Raw
          $plugin = $plugin.Replace("QABstractItemModel", "QAbstractItemModel")
          $plugin = $plugin.Replace('#include <QToolButton>', "#include <QEvent>`r`n#include <QToolBar>`r`n#include <QToolButton>")
          $plugin = $plugin.Replace('static constexpr const char *PLUGIN_VERSION = "0.4.0";', 'static constexpr const char *PLUGIN_VERSION = "0.6.0";')

          # Install a Qt event filter so we can add an action to OBS's existing source context menu.
          $plugin = $plugin.Replace(
              '        obs_frontend_add_event_callback(&SourceDockHideController::FrontendEvent, this);',
              "        obs_frontend_add_event_callback(&SourceDockHideController::FrontendEvent, this);`r`n        if (qApp)`r`n            qApp->installEventFilter(this);")
          $plugin = $plugin.Replace(
              '        obs_frontend_remove_event_callback(&SourceDockHideController::FrontendEvent, this);',
              "        if (qApp)`r`n            qApp->removeEventFilter(this);`r`n        obs_frontend_remove_event_callback(&SourceDockHideController::FrontendEvent, this);")

          # Replace v0.4's heuristic placement with OBS's real Sources toolbar.
          $startMarker = '    QBoxLayout *FindSourcesButtonLayout(QDockWidget *sourcesDock) const'
          $endMarker = '    QString ItemName(const QModelIndex &index) const'
          $start = $plugin.IndexOf($startMarker)
          $end = $plugin.IndexOf($endMarker, $start)
          if ($start -lt 0 -or $end -lt 0) { throw "Could not locate old toolbar-placement block." }

          $toolbarReplacement = @'
    void EnsureHiddenCountButton()
    {
        if (!sourceTree_)
            return;

        auto *mainWindow = static_cast<QMainWindow *>(obs_frontend_get_main_window());
        if (!mainWindow)
            return;

        QToolBar *sourcesToolbar = mainWindow->findChild<QToolBar *>("sourcesToolbar");
        if (!sourcesToolbar) {
            if (auto *sourcesDock = mainWindow->findChild<QDockWidget *>("sourcesDock"))
                sourcesToolbar = sourcesDock->findChild<QToolBar *>("sourcesToolbar");
        }
        if (!sourcesToolbar)
            return;

        if (!hiddenCountButton_) {
            hiddenCountButton_ = new QToolButton(sourcesToolbar);
            hiddenCountButton_->setObjectName("sourceDockHiddenCountButton");
            hiddenCountButton_->setText("0 hidden");
            hiddenCountButton_->setToolButtonStyle(Qt::ToolButtonTextOnly);
            hiddenCountButton_->setAutoRaise(true);
            hiddenCountButton_->setCheckable(true);
            hiddenCountButton_->setMinimumWidth(72);
            hiddenCountButton_->setToolTip("0 hidden sources");
            hiddenCountButton_->setAccessibleName("Show or hide sources hidden from the Sources list");

            QObject::connect(hiddenCountButton_, &QToolButton::clicked, this, [this]() {
                const int hiddenCount = HiddenCountInCurrentModel();
                if (hiddenCount <= 0) {
                    showHiddenRows_ = false;
                    UpdateHiddenCountButton();
                    return;
                }
                showHiddenRows_ = !showHiddenRows_;
                ScheduleApply();
            });

            sourcesToolbar->addWidget(hiddenCountButton_);
        } else if (hiddenCountButton_->parentWidget() != sourcesToolbar) {
            hiddenCountButton_->deleteLater();
            hiddenCountButton_.clear();
            QTimer::singleShot(0, this, [this]() {
                EnsureHiddenCountButton();
                UpdateHiddenCountButton();
            });
            return;
        }

        hiddenCountButton_->show();
    }

'@
          $plugin = $plugin.Substring(0, $start) + $toolbarReplacement + $plugin.Substring($end)

          # Add "Hide in Sources" directly to the normal right-click menu, next to "Hide in Mixer".
          $contextMarker = '    static void FrontendEvent(enum obs_frontend_event event, void *privateData)'
          $contextPos = $plugin.IndexOf($contextMarker)
          if ($contextPos -lt 0) { throw "Could not locate FrontendEvent insertion point." }

          $contextCode = @'
    bool eventFilter(QObject *watched, QEvent *event) override
    {
        if (event && event->type() == QEvent::Show) {
            if (auto *menu = qobject_cast<QMenu *>(watched))
                MaybeAddSourceContextAction(menu);
        }
        return QObject::eventFilter(watched, event);
    }

    void MaybeAddSourceContextAction(QMenu *menu)
    {
        if (!menu || !sourceTree_)
            return;

        const QStringList selected = SelectedNames();
        if (selected.isEmpty())
            return;

        const auto actions = menu->actions();
        int hideMixerIndex = -1;
        for (int i = 0; i < actions.size(); ++i) {
            QAction *action = actions.at(i);
            if (!action)
                continue;

            if (action->objectName() == QStringLiteral("sourceDockHideContextAction"))
                return;

            QString text = action->text();
            text.remove(QLatin1Char('&'));
            if (text.compare(QStringLiteral("Hide in Mixer"), Qt::CaseInsensitive) == 0) {
                hideMixerIndex = i;
                break;
            }
        }

        // This keeps the plugin limited to OBS's normal Source context menu.
        if (hideMixerIndex < 0)
            return;

        QSet<QString> hidden;
        for (const QString &name : HiddenNames())
            hidden.insert(name);

        bool allSelectedAreHidden = true;
        for (const QString &name : selected) {
            if (!hidden.contains(name)) {
                allSelectedAreHidden = false;
                break;
            }
        }

        auto *action = new QAction(allSelectedAreHidden ? QStringLiteral("Unhide from Sources")
                                                         : QStringLiteral("Hide in Sources"),
                                   menu);
        action->setObjectName(QStringLiteral("sourceDockHideContextAction"));

        if (allSelectedAreHidden) {
            QObject::connect(action, &QAction::triggered, this, [this]() { UnhideSelectedRows(); });
        } else {
            QObject::connect(action, &QAction::triggered, this, [this]() { HideSelectedRows(); });
        }

        QAction *before = (hideMixerIndex + 1 < actions.size()) ? actions.at(hideMixerIndex + 1) : nullptr;
        menu->insertAction(before, action);
    }

'@
          $plugin = $plugin.Substring(0, $contextPos) + $contextCode + $plugin.Substring($contextPos)

          # Update the hidden-counter tooltip now that hiding is done from the source's own menu.
          $plugin = $plugin.Replace('"0 hidden sources\nRight-click to hide the currently selected source(s)"', '"0 hidden sources"')
          $plugin = $plugin.Replace('Click to hide them again\nRight-click for options', 'Click to hide them again')
          $plugin = $plugin.Replace('Click to show them temporarily\nRight-click for options', 'Click to show them temporarily')

          Set-Content $pluginPath $plugin -Encoding utf8

          $issPath = "installer/SourceDockHide.iss"
          $iss = Get-Content $issPath -Raw
          $iss = $iss.Replace("0.4.0", "0.6.0")
          Set-Content $issPath $iss -Encoding utf8

      - name: Clone official OBS plugin template
        shell: pwsh
        working-directory: obs-source-dock-hide
        run: git clone --depth 1 https://github.com/obsproject/obs-plugintemplate.git _obs_template

      - name: Configure plugin template
        shell: pwsh
        working-directory: obs-source-dock-hide
        run: |
          Copy-Item "src/plugin-main.cpp" "_obs_template/src/plugin-main.cpp" -Force

          $cmakePath = "_obs_template/CMakeLists.txt"
          $cmake = Get-Content $cmakePath -Raw
          $cmake = $cmake.Replace("src/plugin-main.c", "src/plugin-main.cpp")
          Set-Content $cmakePath $cmake -Encoding utf8

          $presetPath = "_obs_template/CMakePresets.json"
          $preset = Get-Content $presetPath -Raw
          $preset = $preset.Replace('"ENABLE_FRONTEND_API": false', '"ENABLE_FRONTEND_API": true')
          $preset = $preset.Replace('"ENABLE_QT": false', '"ENABLE_QT": true')
          Set-Content $presetPath $preset -Encoding utf8

          $buildspecPath = "_obs_template/buildspec.json"
          $buildspec = Get-Content $buildspecPath -Raw | ConvertFrom-Json
          $buildspec.name = "source-dock-hide"
          $buildspec.displayName = "Source Dock Hide for OBS"
          $buildspec.version = "0.6.0"
          $buildspec.author = "Source Dock Hide community plugin"
          $buildspec.website = "https://obsproject.com/"
          $buildspec.email = "noreply@example.invalid"
          $buildspec | ConvertTo-Json -Depth 20 | Set-Content $buildspecPath -Encoding utf8

      - name: Build Windows x64 Release
        working-directory: obs-source-dock-hide/_obs_template
        shell: pwsh
        env:
          CI: true
        run: .\.github\scripts\Build-Windows.ps1 -Target x64 -Configuration Release

      - name: Stage plugin install tree
        shell: pwsh
        working-directory: obs-source-dock-hide
        run: |
          $releaseRoot = Resolve-Path "_obs_template/release/Release"
          if (Test-Path "stage") { Remove-Item "stage" -Recurse -Force }
          New-Item -ItemType Directory -Path "stage" | Out-Null
          Copy-Item "$releaseRoot\*" "stage\" -Recurse -Force
          $dll = Get-ChildItem "stage" -Recurse -File -Filter "source-dock-hide.dll" | Select-Object -First 1
          if (-not $dll) { throw "source-dock-hide.dll was not found in the OBS template release tree." }

      - name: Locate or install Inno Setup
        id: inno
        shell: pwsh
        working-directory: obs-source-dock-hide
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build standard Setup.exe installer
        shell: pwsh
        working-directory: obs-source-dock-hide
        run: '& "${{ steps.inno.outputs.iscc }}" "installer\SourceDockHide.iss"'

      - name: Generate SHA-256 checksum
        shell: pwsh
        working-directory: obs-source-dock-hide
        run: |
          $file = Get-Item "dist\Source-Dock-Hide-Setup-0.6.0.exe"
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($file.Name)" | Set-Content "$($file.FullName).sha256" -Encoding ascii

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Source-Dock-Hide-Setup-Windows-x64
          path: |
            obs-source-dock-hide/dist/Source-Dock-Hide-Setup-0.6.0.exe
            obs-source-dock-hide/dist/Source-Dock-Hide-Setup-0.6.0.exe.sha256
          if-no-files-found: error
