name: Build Windows plugin + installer

on:
  workflow_dispatch:
  push:
    branches: [obs-source-dock-hide-temp-build]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022

    steps:
      - name: Checkout Source Dock Hide
        uses: actions/checkout@v4

      - name: Patch v0.5 bottom-toolbar placement
        shell: pwsh
        working-directory: obs-source-dock-hide
        run: |
          $pluginPath = "src/plugin-main.cpp"
          $plugin = Get-Content $pluginPath -Raw
          $plugin = $plugin.Replace("QABstractItemModel", "QAbstractItemModel")
          $plugin = $plugin.Replace('#include <QToolButton>', "#include <QToolBar>`r`n#include <QToolButton>")
          $plugin = $plugin.Replace('static constexpr const char *PLUGIN_VERSION = "0.4.0";', 'static constexpr const char *PLUGIN_VERSION = "0.5.0";')

          $startMarker = '    QBoxLayout *FindSourcesButtonLayout(QDockWidget *sourcesDock) const'
          $endMarker = '    QString ItemName(const QModelIndex &index) const'
          $start = $plugin.IndexOf($startMarker)
          $end = $plugin.IndexOf($endMarker, $start)
          if ($start -lt 0 -or $end -lt 0) { throw "Could not locate old toolbar-placement block." }

          $replacement = @'
          void EnsureHiddenCountButton()
          {
          if (!sourceTree_)
          return;

          auto *mainWindow = static_cast<QMainWindow *>(obs_frontend_get_main_window());
          if (!mainWindow)
          return;

          QToolBar *sourcesToolbar = mainWindow->findChild<QToolBar *>("sourcesToolbar");
          if (!sourcesToolbar) {
          if (auto *sourcesDock = mainWindow->findChild<QDockWidget *>("sourcesDock"))
          sourcesToolbar = sourcesDock->findChild<QToolBar *>("sourcesToolbar");
          }
          if (!sourcesToolbar)
          return;

          if (!hiddenCountButton_) {
          hiddenCountButton_ = new QToolButton(sourcesToolbar);
          hiddenCountButton_->setObjectName("sourceDockHiddenCountButton");
          hiddenCountButton_->setText("0 hidden");
          hiddenCountButton_->setToolButtonStyle(Qt::ToolButtonTextOnly);
          hiddenCountButton_->setAutoRaise(true);
          hiddenCountButton_->setCheckable(true);
          hiddenCountButton_->setMinimumWidth(72);
          hiddenCountButton_->setToolTip("0 hidden sources");
          hiddenCountButton_->setAccessibleName("Show or hide sources hidden from the Sources list");
          hiddenCountButton_->setContextMenuPolicy(Qt::CustomContextMenu);

          QObject::connect(hiddenCountButton_, &QToolButton::clicked, this, [this]() {
          const int hiddenCount = HiddenCountInCurrentModel();
          if (hiddenCount <= 0) {
          showHiddenRows_ = false;
          UpdateHiddenCountButton();
          return;
          }
          showHiddenRows_ = !showHiddenRows_;
          ScheduleApply();
          });

          QObject::connect(hiddenCountButton_, &QWidget::customContextMenuRequested, this,
          [this](const QPoint &) { ShowHiddenButtonMenu(); });

          sourcesToolbar->addWidget(hiddenCountButton_);
          } else if (hiddenCountButton_->parentWidget() != sourcesToolbar) {
          hiddenCountButton_->deleteLater();
          hiddenCountButton_.clear();
          QTimer::singleShot(0, this, [this]() {
          EnsureHiddenCountButton();
          UpdateHiddenCountButton();
          });
          return;
          }

          hiddenCountButton_->show();
          }

          '@
          $plugin = $plugin.Substring(0, $start) + $replacement + $plugin.Substring($end)
          Set-Content $pluginPath $plugin -Encoding utf8

          $issPath = "installer/SourceDockHide.iss"
          $iss = Get-Content $issPath -Raw
          $iss = $iss.Replace("0.4.0", "0.5.0")
          Set-Content $issPath $iss -Encoding utf8

      - name: Clone official OBS plugin template
        shell: pwsh
        working-directory: obs-source-dock-hide
        run: git clone --depth 1 https://github.com/obsproject/obs-plugintemplate.git _obs_template

      - name: Configure plugin template
        shell: pwsh
        working-directory: obs-source-dock-hide
        run: |
          Copy-Item "src/plugin-main.cpp" "_obs_template/src/plugin-main.cpp" -Force

          $cmakePath = "_obs_template/CMakeLists.txt"
          $cmake = Get-Content $cmakePath -Raw
          $cmake = $cmake.Replace("src/plugin-main.c", "src/plugin-main.cpp")
          Set-Content $cmakePath $cmake -Encoding utf8

          $presetPath = "_obs_template/CMakePresets.json"
          $preset = Get-Content $presetPath -Raw
          $preset = $preset.Replace('"ENABLE_FRONTEND_API": false', '"ENABLE_FRONTEND_API": true')
          $preset = $preset.Replace('"ENABLE_QT": false', '"ENABLE_QT": true')
          Set-Content $presetPath $preset -Encoding utf8

          $buildspecPath = "_obs_template/buildspec.json"
          $buildspec = Get-Content $buildspecPath -Raw | ConvertFrom-Json
          $buildspec.name = "source-dock-hide"
          $buildspec.displayName = "Source Dock Hide for OBS"
          $buildspec.version = "0.5.0"
          $buildspec.author = "Source Dock Hide community plugin"
          $buildspec.website = "https://obsproject.com/"
          $buildspec.email = "noreply@example.invalid"
          $buildspec | ConvertTo-Json -Depth 20 | Set-Content $buildspecPath -Encoding utf8

      - name: Build Windows x64 Release
        working-directory: obs-source-dock-hide/_obs_template
        shell: pwsh
        env:
          CI: true
        run: .\.github\scripts\Build-Windows.ps1 -Target x64 -Configuration Release

      - name: Stage plugin install tree
        shell: pwsh
        working-directory: obs-source-dock-hide
        run: |
          $releaseRoot = Resolve-Path "_obs_template/release/Release"
          if (Test-Path "stage") { Remove-Item "stage" -Recurse -Force }
          New-Item -ItemType Directory -Path "stage" | Out-Null
          Copy-Item "$releaseRoot\*" "stage\" -Recurse -Force
          $dll = Get-ChildItem "stage" -Recurse -File -Filter "source-dock-hide.dll" | Select-Object -First 1
          if (-not $dll) { throw "source-dock-hide.dll was not found in the OBS template release tree." }

      - name: Locate or install Inno Setup
        id: inno
        shell: pwsh
        working-directory: obs-source-dock-hide
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build standard Setup.exe installer
        shell: pwsh
        working-directory: obs-source-dock-hide
        run: '& "${{ steps.inno.outputs.iscc }}" "installer\SourceDockHide.iss"'

      - name: Generate SHA-256 checksum
        shell: pwsh
        working-directory: obs-source-dock-hide
        run: |
          $file = Get-Item "dist\Source-Dock-Hide-Setup-0.5.0.exe"
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($file.Name)" | Set-Content "$($file.FullName).sha256" -Encoding ascii

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Source-Dock-Hide-Setup-Windows-x64
          path: |
            obs-source-dock-hide/dist/Source-Dock-Hide-Setup-0.5.0.exe
            obs-source-dock-hide/dist/Source-Dock-Hide-Setup-0.5.0.exe.sha256
          if-no-files-found: error
