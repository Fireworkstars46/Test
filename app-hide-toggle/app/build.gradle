plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.apphidetoggle'
    compileSdk 35

    defaultConfig {
        applicationId 'com.local.apphidetoggle'
        minSdk 31
        targetSdk 35
        versionCode 3
        versionName '2.1-installfix'
    }

    packaging {
        jniLibs {
            // Keep native libraries compressed/extracted at install time. This avoids
            // INSTALL_FAILED_INVALID_APK on devices that reject unaligned .so files
            // from transitive ADB/Conscrypt dependencies.
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
}
